# ===== DATABASE =====
spring.datasource.url=jdbc:postgresql://localhost:5432/school_db
spring.datasource.username=school_user
spring.datasource.password=school_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== SERVER =====
server.port=8080
server.servlet.context-path=/api/v1

# ===== JWT =====
jwt.secret=your_very_long_and_secure_jwt_secret_key_here_minimum_256_bits_long
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# ===== AWS S3 (optional — comment out if not using) =====
cloud.aws.s3.bucket=your_bucket_name
cloud.aws.credentials.access-key=your_access_key
cloud.aws.credentials.secret-key=your_secret_key
cloud.aws.region.static=us-east-1

# ===== CORS =====
cors.allowed-origins=http://localhost:3000

# ===== LOGGING =====
logging.level.com.school=DEBUG
logging.level.org.springframework.security=DEBUG

# ===== SWAGGER UI =====
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.filter=true
