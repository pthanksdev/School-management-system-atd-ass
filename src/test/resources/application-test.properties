spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

server.servlet.context-path=/api/v1

jwt.secret=test_secret_key_minimum_256_bits_long_for_testing_only
jwt.expiration=3600000
jwt.refresh-expiration=7200000

firebase.config.path=non-existent-path-for-tests

cloud.aws.s3.bucket=test-bucket
cloud.aws.credentials.access-key=test-key
cloud.aws.credentials.secret-key=test-secret
cloud.aws.region.static=us-east-1

cors.allowed-origins=http://localhost:3000

logging.level.com.school=WARN
logging.level.org.springframework.security=WARN
